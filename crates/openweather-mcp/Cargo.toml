[package]
name = "openweather-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
openweather-sdk = { path = "../openweather-sdk" }
rmcp = { version = "3.11", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }
