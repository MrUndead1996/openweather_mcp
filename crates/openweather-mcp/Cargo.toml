[package]
name = "openweather-mcp"
version = "1.0.2"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
moka = { version = "0.12", default-features = false, features = ["future"] }
openweather-onecall-sdk = { path = "../openweather-sdk" }
rmcp = { version = "3.11", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tempfile = "3"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }
