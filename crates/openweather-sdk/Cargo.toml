[package]
name = "openweather-onecall-sdk"
version = "1.0.1"
edition.workspace = true
license.workspace = true
description = "Async, typed Rust client for the OpenWeather One Call API 4.0"
repository = "https://github.com/MrUndead1996/openweather_mcp"
keywords = ["openweather", "weather", "forecast", "onecall"]
categories = ["api-bindings"]
readme = "README.md"
include = ["/src/**", "/LICENSE", "/README.md"]
publish = ["crates-io"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
webpki-roots = "1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
