name: CI and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format and test
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run tests
        run: cargo +stable test --locked --workspace

  validate-release:
    name: Validate release versions
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag against the SDK and MCP versions
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          for crate in ("openweather-sdk", "openweather-mcp"):
              manifest = Path("crates", crate, "Cargo.toml")
              version = tomllib.loads(manifest.read_text())["package"]["version"]
              if "+" in version or tag != f"v{version}":
                  raise SystemExit(f"Tag {tag!r} must match the release version in {manifest}: v{version}")
          PY

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: validate-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      ARTIFACT: openweather-mcp-linux-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and musl tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$TARGET"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build MCP binary
        env:
          CC: musl-gcc
        run: cargo +stable build --locked --release --package openweather-mcp --target "$TARGET"
      - name: Verify static binary and MCP startup
        shell: bash
        run: |
          test "$(uname -m)" = "$ARCH"
          binary="target/$TARGET/release/openweather-mcp"
          program_headers="$(readelf --program-headers --wide "$binary")"
          dynamic_section="$(readelf --dynamic --wide "$binary")"
          if grep -Eq '^[[:space:]]*INTERP[[:space:]]' <<<"$program_headers" ||
             grep -Fq '(NEEDED)' <<<"$dynamic_section"; then
            echo "Expected a statically linked binary" >&2
            exit 1
          fi

          python3 - "$binary" <<'PY'
          import json
          import os
          import subprocess
          import sys

          env = dict(os.environ, OPENWEATHER_API_KEY="ci-smoke-test", OPENWEATHER_API_VERSION="v4")
          env.pop("OPENWEATHER_API_KEY_FILE", None)
          initialize = {
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2025-11-25",
                  "capabilities": {},
                  "clientInfo": {"name": "ci-smoke-test", "version": "0.1.0"},
              },
          }
          initialized = {"jsonrpc": "2.0", "method": "notifications/initialized"}
          completed = subprocess.run(
              [sys.argv[1]],
              input=f"{json.dumps(initialize)}\n{json.dumps(initialized)}\n",
              env=env,
              text=True,
              stdout=subprocess.PIPE,
              timeout=10,
              check=True,
          )
          reply = json.loads(completed.stdout)
          assert reply["id"] == 1 and reply["result"]["serverInfo"]["name"] == "openweather-mcp", reply
          PY
      - name: Package MCP binary and license
        run: tar -czf "$ARTIFACT" -C "target/$TARGET/release" openweather-mcp -C "$GITHUB_WORKSPACE" LICENSE
      - name: Upload binary archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ARTIFACT }}
          archive: false
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: openweather-mcp-linux-*.tar.gz
          merge-multiple: true
      - name: Create release and attach both Linux archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            dist/openweather-mcp-linux-x86_64.tar.gz
            dist/openweather-mcp-linux-aarch64.tar.gz
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" "${assets[@]}"

  publish-sdk:
    name: Publish SDK to crates.io
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify SDK package
        run: cargo +stable publish --locked --dry-run --package openweather-onecall-sdk
      - name: Authenticate with crates.io Trusted Publishing
        if: env.BOOTSTRAP_TOKEN == ''
        id: crates-io-auth
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish SDK
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo +stable publish --locked --package openweather-onecall-sdk
